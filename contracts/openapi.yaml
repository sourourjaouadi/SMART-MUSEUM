openapi: 3.0.3
info:
  title: Smart Museum API
  version: 1.2.0
  description: |
    Contrat v1.2. Un doublon de measurementId renvoie 200 (idempotence), pas 409.
    v1.2 : Thing Descriptions W3C WoT 1.1 (JSON-LD 1.1) et decouverte pending -> active.
    Authentification humaine par JWT Bearer. Les rôles et zones autorisés sont
    relus dans le compte MongoDB à chaque requête protégée. Les jetons de service
    restent réservés aux intégrations serveur. Le serveur exige
    JWT_SIGNING_KEY_BASE64 (au moins 32 aléatoires octets avant encodage Base64),
    accepte une durée configurée entre 60 et 3600 secondes (900 par défaut), et
    valide l'issuer configuré par JWT_ISSUER (smart-museum par défaut).
servers:
  - url: http://localhost:8080
paths:
  /api/auth/login:
    post:
      summary: Authentifier un compte actif
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Jeton d'accès de courte durée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /api/users:
    post:
      summary: ADMIN - créer un compte CLIENT avec ses zones autorisées
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientProvisionRequest' }
      responses:
        '201':
          description: Compte CLIENT créé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserAccount' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/health:
    get:
      summary: Etat du service et de MongoDB
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: UP }
                  mongo: { type: string, enum: [UP, DOWN] }
  /api/ingest/measurements:
    post:
      summary: Ingestion d'une mesure (Node-RED uniquement)
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Measurement' }
      responses:
        '202': { description: Mesure acceptee }
        '200': { description: Doublon, deja traitee }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '422':
          description: Hors plage (OUT_OF_RANGE) ou propriete/unite non declaree dans la TD (UNDECLARED_PROPERTY)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/devices:
    get:
      summary: Liste des appareils
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, active, rejected, offline] } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/devices/{deviceId}:
    get:
      summary: Detail d'un appareil
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: OK
          headers:
            Link:
              description: RFC 8288, <.../api/things/{deviceId}>; rel="describedby"; type="application/td+json"
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/devices/{deviceId}/approve:
    post:
      summary: ADMIN - approuver un appareil decouvert (pending -> active)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: Appareil actif
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /api/devices/{deviceId}/reject:
    post:
      summary: ADMIN - rejeter un appareil (ses mesures seront refusees)
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: Appareil rejete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /api/things:
    post:
      summary: Annonce de decouverte (Node-RED relaie le topic MQTT museum/v1/{zoneId}/{deviceId}/td)
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ThingAnnouncement' }
      responses:
        '201':
          description: Nouvel appareil enregistre en statut pending
          headers:
            Location: { schema: { type: string } }
            Link: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementResult' }
        '200':
          description: Appareil deja connu, TD mise a jour (statut inchange)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnnouncementResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
    get:
      summary: ADMIN - toutes les Thing Descriptions
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ThingDescription' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/things/{deviceId}:
    get:
      summary: Thing Description W3C WoT 1.1 d'un appareil
      security: [{ bearerAuth: [] }]
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: OK
          content:
            application/td+json:
              schema: { $ref: '#/components/schemas/ThingDescription' }
        '404': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/measurements/latest:
    get:
      summary: Derniere mesure de chaque propriete pour une zone
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: zoneId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Measurement' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
  /api/measurements:
    get:
      summary: Historique
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: deviceId, in: query, required: true, schema: { type: string } }
        - { name: property, in: query, required: true, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: limit, in: query, schema: { type: integer, default: 1000, maximum: 5000 } }
      responses:
        '200':
          description: Les "limit" mesures les plus recentes, triees par observedAt croissant
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Measurement' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  parameters:
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema: { type: string, pattern: '^[A-Za-z0-9._-]{1,64}$' }
  responses:
    Error:
      description: Erreur JSON {error,message}; 400 validation, 401 authentification, 403 autorisation ou appareil non fiable, 404 ressource absente, 409 conflit, 422 plage/propriete
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
  schemas:
    ErrorResponse:
      type: object
      properties:
        error: { type: string, enum: [INVALID_SCHEMA, INVALID_TD, UNAUTHORIZED, FORBIDDEN, DEVICE_NOT_TRUSTED, NOT_FOUND, INVALID_STATE, OUT_OF_RANGE, UNDECLARED_PROPERTY, INTERNAL_ERROR] }
        message: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 72, writeOnly: true }
    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: Short-lived signed access token; default lifetime 900 seconds }
        tokenType: { type: string, enum: [Bearer] }
        expiresIn: { type: integer, minimum: 60, maximum: 3600, description: Token lifetime in seconds }
        user: { $ref: '#/components/schemas/UserAccount' }
    ClientProvisionRequest:
      type: object
      required: [name, email, password, zoneIds]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 12, maxLength: 72, writeOnly: true, description: Maximum 72 UTF-8 bytes for BCrypt }
        zoneIds:
          type: array
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 64 }
          description: Empty assignment grants no zone access.
    UserAccount:
      type: object
      required: [userId, name, email, role, status, zoneIds]
      properties:
        userId: { type: string, format: uuid }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string, enum: [ADMIN, CLIENT] }
        status: { type: string, enum: [active, disabled] }
        zoneIds: { type: array, items: { type: string } }
    Measurement:
      type: object
      required: [measurementId, deviceId, zoneId, property, value, unit, observedAt, source]
      properties:
        measurementId: { type: string, format: uuid }
        deviceId: { type: string }
        zoneId: { type: string }
        gatewayId: { type: string }
        property: { type: string, enum: [temperature, humidity, pressure, illuminance] }
        value: { type: number }
        unit: { type: string }
        observedAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time, readOnly: true }
        source: { type: string, enum: [real, simulated] }
        quality: { type: string, enum: [good, uncertain, bad], default: good }
    Device:
      type: object
      properties:
        deviceId: { type: string }
        type: { type: string }
        zoneId: { type: string }
        gatewayId: { type: string }
        status: { type: string, enum: [pending, active, rejected, offline] }
        lastSeenAt: { type: string, format: date-time }
        thingId: { type: string, example: 'urn:museum:device:bme280-01' }
    ThingAnnouncement:
      type: object
      required: [deviceId, zoneId, td]
      properties:
        deviceId: { type: string }
        zoneId: { type: string }
        gatewayId: { type: string }
        type: { type: string, example: bme280 }
        td: { $ref: '#/components/schemas/ThingDescription' }
    AnnouncementResult:
      type: object
      properties:
        status: { type: string, enum: [registered, updated] }
        deviceId: { type: string }
        deviceStatus: { type: string, enum: [pending, active, offline] }
    ThingDescription:
      description: W3C WoT Thing Description 1.1 (JSON-LD 1.1). L'id doit se terminer par ":{deviceId}".
      type: object
      required: ['@context', id, title, securityDefinitions, security]
      additionalProperties: true
      properties:
        '@context':
          description: https://www.w3.org/2022/wot/td/v1.1, ou un tableau qui commence par cette URI
          oneOf:
            - { type: string }
            - { type: array, items: {} }
        '@type': { type: string }
        id: { type: string, format: uri, example: 'urn:museum:device:bme280-01' }
        title: { type: string }
        securityDefinitions: { type: object, additionalProperties: { type: object, required: [scheme] } }
        security:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        properties: { type: object, additionalProperties: { $ref: '#/components/schemas/InteractionAffordance' } }
        actions: { type: object, additionalProperties: { $ref: '#/components/schemas/InteractionAffordance' } }
        events: { type: object, additionalProperties: { $ref: '#/components/schemas/InteractionAffordance' } }
    InteractionAffordance:
      type: object
      required: [forms]
      additionalProperties: true
      properties:
        title: { type: string }
        type: { type: string }
        unit: { type: string }
        forms:
          type: array
          minItems: 1
          items:
            type: object
            required: [href]
            properties:
              href: { type: string, example: 'mqtt://localhost:1883/museum/v1/salle-01/bme280-01/telemetry' }
              op: { type: array, items: { type: string } }
              contentType: { type: string }
