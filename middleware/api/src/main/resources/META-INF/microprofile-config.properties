# Eclipse JNoSQL configuration is supplied by process environment variables.
# WildFly does not load .env files automatically. The launch scripts export
# JNOSQL_DOCUMENT_DATABASE and JNOSQL_MONGODB_HOST into the server process.
# Leaving database and host unset here prevents accidental use of the original
# museum database when the environment has not been configured.
jnosql.document.provider=org.eclipse.jnosql.databases.mongodb.communication.MongoDBDocumentConfiguration
