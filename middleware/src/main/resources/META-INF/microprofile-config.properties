# Eclipse JNoSQL (Jakarta NoSQL / Jakarta Data) - connexion MongoDB.
# Surchargeables par variables d'environnement : JNOSQL_DOCUMENT_DATABASE, JNOSQL_MONGODB_HOST, JNOSQL_MONGODB_URL...
jnosql.document.database=museum
jnosql.mongodb.host=localhost:27017
jnosql.document.provider=org.eclipse.jnosql.databases.mongodb.communication.MongoDBDocumentConfiguration
