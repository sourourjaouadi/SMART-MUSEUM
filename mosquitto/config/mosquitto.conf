# Broker Mosquitto de DEVELOPPEMENT (poste local).
# Sans mot de passe : docker-compose.yml ne le publie que sur 127.0.0.1:1883.
# Ne jamais utiliser en production : voir mosquitto.prod.conf (TLS 8883, comptes, ACL).

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
