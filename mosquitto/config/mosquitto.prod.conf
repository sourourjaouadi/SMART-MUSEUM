# Broker Mosquitto de PRODUCTION (VM cloud).
# - 8883 : seul port public, MQTT sur TLS, un compte par appareil, ACL par appareil.
# - 1883 : ecouteur interne au reseau Docker (jamais publie), lecture seule pour Node-RED.
# Aucune interface d'administration n'est exposee.

per_listener_settings true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# --- Ecouteur interne : Node-RED (meme reseau Docker), lecture seule -----------------
listener 1883
allow_anonymous true
acl_file /mosquitto/config/acl.internal

# --- Ecouteur public : passerelles, MQTT sur TLS avec mot de passe ---------------------
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
require_certificate false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl.devices
