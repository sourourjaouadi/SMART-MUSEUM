name: middleware-ci
on:
  push:
    paths: ["middleware/**", ".github/workflows/middleware-ci.yml"]
  pull_request:
    paths: ["middleware/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build et tests
        run: mvn -B -f middleware/pom.xml verify
