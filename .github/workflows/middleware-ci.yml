name: Smart Museum CI

# Middleware: tests and the three middleware WARs (core, iam, api).
# The Client and Admin WARs are built by their own frontend workflow.
on:
  push:
    branches: [main, develop]
    paths: ["middleware/**", ".github/workflows/middleware-ci.yml"]
  pull_request:
    paths: ["middleware/**", ".github/workflows/middleware-ci.yml"]

permissions:
  contents: read

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test
        run: mvn -B -f middleware/pom.xml clean verify

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: middleware-test-reports-${{ github.sha }}
          path: middleware/*/target/surefire-reports/
          if-no-files-found: warn
          retention-days: 7

      - name: Verify WAR artifacts
        run: |
          status=0
          for war in \
            middleware/core/target/smart-museum-core.war \
            middleware/iam/target/smart-museum-iam.war \
            middleware/api/target/smart-museum.war; do
            if [ -s "$war" ]; then
              sha256sum "$war"
            else
              echo "::error::WAR missing or empty: $war"
              status=1
            fi
          done
          exit "$status"

      - name: Upload WAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-museum-middleware-${{ github.sha }}
          path: |
            middleware/core/target/smart-museum-core.war
            middleware/iam/target/smart-museum-iam.war
            middleware/api/target/smart-museum.war
          if-no-files-found: error
          retention-days: 7
