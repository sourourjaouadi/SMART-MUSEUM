<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#183c34" />
    <title>Offline | Smart Museum</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        background: #f4f3ee;
        color: #23332f;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        max-width: 32rem;
        padding: 2rem;
        text-align: center;
      }

      h1 {
        color: #183c34;
      }
    </style>

  <body>
    <main>
      <p>Smart Museum</p>
      <h1>You are offline</h1>
      <p>
        The dashboard shell is unavailable right now. Sensor measurements are
        not stored for offline use. Reconnect to load the latest data.
      </p>
    </main>
  </body>
</html>
